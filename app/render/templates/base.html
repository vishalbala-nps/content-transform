<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<title>{{ title }}</title>
<style>
  /* Every value below comes from the Theme (render/theme.py): the house style,
     or a brand kit's. Colours and the font name are validated when a kit is
     saved, so they are safe to write into CSS unescaped (|safe: autoescaping
     would turn the font's quotes into entities, which CSS does not read).
     Free text such as the organisation's name never goes into CSS; it
     reaches the header through string-set, like the kind and the note. */
  :root {
    --ink: {{ theme.ink }};
    --muted: {{ theme.muted }};
    --accent: {{ theme.accent }};
    --accent-soft: {{ theme.accent_soft }};
    --rule: {{ theme.rule }};
  }

  /* Margin boxes do not inherit from :root, so their colours are repeated here. */
  @page {
    size: A4;
    margin: 24mm 20mm 22mm;
    @top-left {
      content: string(kind);
      font: 600 7.5pt {{ theme.css_fonts|safe }};
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: {{ theme.accent }};
      vertical-align: bottom;
      padding-bottom: 3mm;
    }
    @top-right {
      content: string(org);
      font: 7.5pt {{ theme.css_fonts|safe }};
      color: {{ theme.muted }};
      vertical-align: bottom;
      padding-bottom: 3mm;
    }
    @bottom-left {
      content: string(note);
      font: 7.5pt {{ theme.css_fonts|safe }};
      color: {{ theme.muted }};
    }
    @bottom-right {
      content: "Page " counter(page) " of " counter(pages);
      font: 7.5pt {{ theme.css_fonts|safe }};
      color: {{ theme.muted }};
    }
  }

  html {
    font-family: {{ theme.css_fonts|safe }};
    font-size: 10.5pt;
    line-height: 1.5;
    color: var(--ink);
  }
  body { margin: 0; }

  /* Feed the running header and footer. Not display: none, which would never set the string. */
  .kind { string-set: kind content(); height: 0; overflow: hidden; }
  .note { string-set: note content(); height: 0; overflow: hidden; }
  .org { string-set: org content(); height: 0; overflow: hidden; }

  /* A brand kit's logo, top right of the first page. */
  .logo { float: right; max-height: 14mm; max-width: 45mm; margin: 0 0 4mm 8mm; }

  h1 {
    font-size: 21pt;
    line-height: 1.2;
    font-weight: 700;
    margin: 0 0 3mm;
  }
  h2 {
    font-size: 9pt;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 8mm 0 2.5mm;
    break-after: avoid;
  }
  p { margin: 0 0 2.5mm; }
  li { break-inside: avoid; }

  .source {
    color: var(--muted);
    font-size: 9pt;
    padding-bottom: 5mm;
    border-bottom: 0.6pt solid var(--rule);
    margin-bottom: 6mm;
  }

  .callout {
    background: var(--accent-soft);
    border-left: 2.5pt solid var(--accent);
    padding: 4mm 5mm;
    font-size: 11.5pt;
    line-height: 1.45;
    break-inside: avoid;
  }
  .callout .label {
    display: block;
    font-size: 8pt;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.5mm;
  }

  ul.points { list-style: none; padding: 0; margin: 0; }
  ul.points li {
    position: relative;
    padding: 0 0 0 5mm;
    margin-bottom: 2.5mm;
  }
  ul.points li::before {
    content: "";
    position: absolute;
    left: 0;
    top: 2mm;
    width: 1.6mm;
    height: 1.6mm;
    background: var(--accent);
  }

  ol.steps { list-style: none; padding: 0; margin: 0; counter-reset: step; }
  ol.steps li {
    counter-increment: step;
    position: relative;
    padding: 0.3mm 0 0 8mm;
    margin-bottom: 3mm;
  }
  ol.steps li::before {
    content: counter(step);
    position: absolute;
    left: 0;
    top: 0;
    width: 5mm;
    height: 5mm;
    border-radius: 50%;
    background: var(--accent);
    color: white;
    font-size: 7.5pt;
    font-weight: 700;
    line-height: 5mm;
    text-align: center;
  }

{% block style %}{% endblock %}
</style>
</head>
<body>
<div class="kind">{% block kind %}{% endblock %}</div>
<div class="note">{% block note %}{% endblock %}</div>
<div class="org">{{ theme.org_name }}</div>
{% if theme.logo_uri %}<img class="logo" src="{{ theme.logo_uri }}" alt="{{ theme.org_name }}">{% endif %}
{% block content %}{% endblock %}
</body>
</html>
